name: "Prepare Check Outputs"
description: "Determines environment and target refs for check workflows."
inputs:
  ref:
    description: "Manual ref override"
    required: false
  repo:
    description: "Manual repo override"
    required: false
  sha:
    description: "Immutable source SHA; caller-approved SHA required for issue comments and cross-repository overrides"
    required: false
  pr-base-sha:
    description: "Manual base SHA override"
    required: false
  checkout-path:
    description: "Manual checkout path override"
    required: false
  build-path:
    description: "Manual build path override"
    required: false
outputs:
  is_act:
    description: "Whether running in act"
    value: ${{ steps.detect_act.outputs.is_act }}
  ref:
    description: "The resolved ref"
    value: ${{ steps.resolve.outputs.ref }}
  sha:
    description: "The immutable source SHA; metadata resolution is not authorization"
    value: ${{ steps.resolve.outputs.sha }}
  repo:
    description: "The resolved repository"
    value: ${{ steps.resolve.outputs.repo }}
  base_sha:
    description: "The resolved base SHA for diffing"
    value: ${{ steps.resolve.outputs.base_sha }}
  pr_number:
    description: "The PR number if available"
    value: ${{ steps.resolve.outputs.pr_number }}
  checkout_path:
    description: "The resolved checkout path"
    value: ${{ steps.resolve.outputs.checkout_path }}
  build_path:
    description: "The resolved build path"
    value: ${{ steps.resolve.outputs.build_path }}
runs:
  using: "composite"
  steps:
    - name: Get PR Info
      if: github.event_name == 'issue_comment'
      id: get_pr
      uses: Framework-R-D/action-get-pr-info@25fa7302840aaf7330af010571bcd3c881a6770e # v2

    - name: Detect act environment
      id: detect_act
      uses: Framework-R-D/action-detect-act-env@ddb96e6d16df2dab61947c45270b65ba1cadc863 # v1

    - name: Resolve outputs
      id: resolve
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        INPUT_REF: ${{ inputs.ref }}
        INPUT_SHA: ${{ inputs.sha }}
        INPUT_REPO: ${{ inputs.repo }}
        INPUT_PR_BASE_SHA: ${{ inputs.pr-base-sha }}
        INPUT_CHECKOUT_PATH: ${{ inputs.checkout-path }}
        INPUT_BUILD_PATH: ${{ inputs.build-path }}
        GET_PR_REF: ${{ steps.get_pr.outputs.ref }}
        GET_PR_SHA: ${{ steps.get_pr.outputs.sha }}
        GET_PR_REPO: ${{ steps.get_pr.outputs.repo }}
        GET_PR_BASE_SHA: ${{ steps.get_pr.outputs.base_sha }}
      run: |
        python3 -I "$GITHUB_ACTION_PATH/resolve_target.py"
